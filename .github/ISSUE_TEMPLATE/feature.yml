# SPDX-License-Identifier: MPL-2.0
name: Feature request
description: Propose a focused capability or safety improvement
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the need independently of a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Market-data safety and compatibility considerations
      description: Include rollback, storage, and Windows PowerShell 5.1 implications when relevant.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
