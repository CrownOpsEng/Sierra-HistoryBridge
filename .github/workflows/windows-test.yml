# SPDX-License-Identifier: MPL-2.0
name: Windows tests
run-name: ${{ github.event.pull_request.title || github.ref_name }}

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  commit-policy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate commit messages
        run: python .\scripts\validate_commit_messages.py --all-reachable

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python .\scripts\validate_commit_messages.py --pull-request-title $env:PR_TITLE

  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: SCID conversion self-test
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tests\Run-SelfTest.ps1

      - name: Package and PowerShell tests
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tests\Test-Package.ps1

      - name: Build release
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\Build-Release.ps1

      - name: Generate release checksum
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $Archives = @(Get-ChildItem -LiteralPath .\dist -Filter '*.zip')
          if ($Archives.Count -ne 1) {
              throw "Expected exactly one release archive; found $($Archives.Count)."
          }
          $Digest = (Get-FileHash -LiteralPath $Archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Digest  $($Archives[0].Name)" | Set-Content -LiteralPath .\dist\SHA256SUMS.txt -Encoding Ascii

      - name: Upload tagged release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SierraHistoryBridge-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
