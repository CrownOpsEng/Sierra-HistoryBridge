# SPDX-License-Identifier: MPL-2.0
name: Windows self-test
run-name: ${{ github.event.pull_request.title || github.ref_name }}

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  commit-policy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate commit messages
        run: python .\scripts\validate_commit_messages.py --all-reachable

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python .\scripts\validate_commit_messages.py --pull-request-title $env:PR_TITLE

  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run SCID conversion self-test
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tests\Run-SelfTest.ps1
